name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer ci

  map-plus-edit-dogfood:
    name: agent-map + agent-edit only (no agent-loop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Prove installed agent-map includes the 0.22.6 type-import fix
        run: |
          php -r 'require "vendor/autoload.php"; $v = \Composer\InstalledVersions::getPrettyVersion("voku/agent-map"); if ($v === null || version_compare(ltrim($v, "v"), "0.22.6", "<")) { fwrite(STDERR, "Expected installed agent-map >=0.22.6, got " . ($v ?? "unknown") . "\n"); exit(1); } echo "agent-map " . $v . "\n";'
      - name: Prove agent-loop is not installed (not even transitively)
        run: |
          test ! -d vendor/voku/agent-loop
          ! composer show 'voku/agent-loop' 2>/dev/null
      - name: Dogfood mutation lifecycle, fail-closed guards and publication rollback
        run: php tools/map-edit-dogfood.php
